name: Agent marketing (post du jour)

on:
  schedule:
    - cron: "0 7 * * *" # tous les jours à 07h00 (heure d'Abidjan = UTC)
  workflow_dispatch:
    inputs:
      type:
        description: "Forcer un type (tip, dodont, question, rule, offer) — vide = rotation automatique"
        required: false
        default: ""
      dry:
        description: "Test sans rien envoyer (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-agent/package-lock.json
      - name: Installer ffmpeg (montage vidéo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer la voix off (Piper, gratuit)
        continue-on-error: true
        run: |
          pip install piper-tts
          python -m piper.download_voices fr_FR-siwis-medium --data-dir voices
          ls -la voices
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Créer et envoyer le post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TYPE: ${{ github.event.inputs.type }}
        run: node src/run.cjs ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - name: Garder l'historique
        run: |
          git config user.name "marketing-agent"
          git config user.email "marketing-agent@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -q -m "chore(agent): historique des posts [skip ci]" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-du-jour
          path: marketing-agent/out/*
          retention-days: 7
