name: Rattrapage Instagram (posts déjà créés)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Test sans publier (true/false)"
        required: false
        default: "false"
      limit:
        description: "Nombre max de posts (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write

# Même groupe que le post du jour : jamais en même temps, pour garder l'ordre chronologique.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: marketing-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-agent/package-lock.json
      - name: Installer ffmpeg (montage vidéo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer la voix off (Piper, gratuit)
        continue-on-error: true
        run: |
          pip install piper-tts
          python -m piper.download_voices fr_FR-siwis-medium --data-dir voices
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Publier les posts manquants (du plus ancien au plus récent)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/backfill.cjs ${{ github.event.inputs.dry == 'true' && '--dry' || '' }} ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
      - name: Garder l'historique
        if: always()
        run: |
          git config user.name "marketing-agent"
          git config user.email "marketing-agent@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -q -m "chore(agent): historique Instagram (rattrapage) [skip ci]" && git pull --rebase -q && git push)
